name: Publish to npm

on:
  release:
    types: [published]
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      release_type:
        description: Semantic version component to increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Prepare new release version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Releases must be dispatched from the default branch: $DEFAULT_BRANCH" >&2
            exit 1
          fi
          npm version "$RELEASE_TYPE" --no-git-tag-version
          release_version=$(node -p 'require("./package.json").version')
          echo "RELEASE_TAG=v$release_version" >> "$GITHUB_ENV"
          package_name=$(node -p 'require("./package.json").name')
          set +e
          npm_view_output=$(npm view "$package_name@$release_version" version 2>&1)
          npm_view_status=$?
          set -e
          if [[ $npm_view_status -eq 0 ]]; then
            echo "$package_name@$release_version is already published to npm." >&2
            exit 1
          fi
          if [[ "$npm_view_output" != *"E404"* ]]; then
            echo "$npm_view_output" >&2
            exit $npm_view_status
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check package
        run: npm run check

      - name: Open release pull request
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          release_branch="release/$RELEASE_TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$release_branch"
          git add package.json package-lock.json
          git commit -m "release: $RELEASE_TAG"
          git push origin "$release_branch"
          gh pr create \
            --base "$DEFAULT_BRANCH" \
            --head "$release_branch" \
            --title "release: $RELEASE_TAG" \
            --body "Bump the package version to $RELEASE_TAG. Merging this PR creates the tag and GitHub Release, then publishes the package to npm."

  publish:
    if: >-
      ${{
        (github.event_name == 'release' && !github.event.release.prerelease) ||
        (github.event_name == 'pull_request' && github.event.pull_request.merged && startsWith(github.head_ref, 'release/v'))
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Resolve release version
        env:
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          package_version=$(node -p 'require("./package.json").version')
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            release_tag=${PR_BRANCH#release/}
          else
            release_tag=$EVENT_RELEASE_TAG
          fi
          if [[ "$release_tag" != "v$package_version" ]]; then
            echo "Release tag $release_tag does not match package version v$package_version." >&2
            exit 1
          fi
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Check package
        run: npm run check

      - name: Create tag and GitHub Release
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_commit=$(git rev-parse HEAD)
          if tagged_commit=$(git rev-list -n 1 "$RELEASE_TAG" 2>/dev/null); then
            if [[ "$tagged_commit" != "$release_commit" ]]; then
              echo "$RELEASE_TAG already points to $tagged_commit instead of $release_commit" >&2
              exit 1
            fi
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already exists at this commit; reusing it."
          else
            gh release create "$RELEASE_TAG" --target "$release_commit" --generate-notes
          fi

      - name: Publish package
        run: npm publish
