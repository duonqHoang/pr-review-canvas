name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_type:
        description: Semantic version component to increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: Check out the release
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify existing release version
        if: ${{ github.event_name == 'release' }}
        run: node -e 'const expected = `v${require("./package.json").version}`; if (process.env.RELEASE_TAG !== expected) { throw new Error(`Release tag ${process.env.RELEASE_TAG} does not match ${expected}`); }'

      - name: Prepare new release version
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Releases must be dispatched from the default branch: $DEFAULT_BRANCH" >&2
            exit 1
          fi
          npm version "$RELEASE_TYPE" --no-git-tag-version
          release_version=$(node -p 'require("./package.json").version')
          echo "RELEASE_TAG=v$release_version" >> "$GITHUB_ENV"
          package_name=$(node -p 'require("./package.json").name')
          set +e
          npm_view_output=$(npm view "$package_name@$release_version" version 2>&1)
          npm_view_status=$?
          set -e
          if [[ $npm_view_status -eq 0 ]]; then
            echo "$package_name@$release_version is already published to npm." >&2
            exit 1
          fi
          if [[ "$npm_view_output" != *"E404"* ]]; then
            echo "$npm_view_output" >&2
            exit $npm_view_status
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check package
        run: npm run check

      - name: Commit release version
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "release: $RELEASE_TAG"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Create tag and GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if tagged_commit=$(git rev-list -n 1 "$RELEASE_TAG" 2>/dev/null); then
            if [[ "$tagged_commit" != "$RELEASE_COMMIT" ]]; then
              echo "$RELEASE_TAG already points to $tagged_commit instead of $RELEASE_COMMIT" >&2
              exit 1
            fi
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already exists at this commit; reusing it."
          else
            gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" --generate-notes
          fi

      - name: Publish package
        run: npm publish
