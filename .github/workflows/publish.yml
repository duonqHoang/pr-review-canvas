name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version from package.json, without the v prefix
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.event.release.tag_name }}

    steps:
      - name: Check out the release
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Releases must be dispatched from the default branch: $DEFAULT_BRANCH" >&2
            exit 1
          fi
          node -e 'const expected = `v${require("./package.json").version}`; if (process.env.RELEASE_TAG !== expected) { throw new Error(`Release tag ${process.env.RELEASE_TAG} does not match ${expected}`); }'

      - name: Install dependencies
        run: npm ci

      - name: Check package
        run: npm run check

      - name: Create tag and GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if tagged_commit=$(git rev-list -n 1 "$RELEASE_TAG" 2>/dev/null); then
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "$RELEASE_TAG already points to $tagged_commit instead of $GITHUB_SHA" >&2
              exit 1
            fi
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already exists at this commit; reusing it."
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --generate-notes
          fi

      - name: Publish package
        run: npm publish
